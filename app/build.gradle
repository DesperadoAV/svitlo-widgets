// Збірка: gradle -p app assembleRelease (GitHub Actions). Файли — на старих місцях: AndroidManifest.xml, src/, res/.
// google-services.json (з секрету GOOGLE_SERVICES_JSON) — для сповіщень Firebase; без нього застосунок збирається і працює, лише без сповіщень.
plugins {
    id 'com.android.application' version '8.7.3'
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
def hasFcm = file('google-services.json').exists()
if (hasFcm) apply plugin: 'com.google.gms.google-services'

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int
android {
    namespace 'ua.svitlo.widget'
    compileSdk 35
    defaultConfig {
        applicationId 'ua.svitlo.widget'
        minSdk 21                                   // Android 5.0+ (Firebase)
        targetSdk 35
        versionCode run + 100
        versionName "1.1.${run}"
        buildConfigField 'boolean', 'HAS_FCM', hasFcm ? 'true' : 'false'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
    signingConfigs {
        release {
            def ks = System.getenv('KS_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KS_PASS')
                keyAlias 'svitlo'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KS_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
