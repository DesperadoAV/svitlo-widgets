name: Мапа (desperadoav.github.io/Svitlo_in_Slavutych)

# Сторінка мапи живе тут, у map/index.html. Коли вона змінюється — перевірка в справжньому браузері (Google, тайли й
# Leaflet підставні, справжні дані не чіпаємо), і якщо все добре — копія йде в репозиторій мапи DesperadoAV/Svitlo_in_Slavutych
# (звідти її показує GitHub Pages). Потрібен секрет MAP_TOKEN — ключ GitHub з правом запису лише в репозиторій мапи.
# Якщо мапу змінили напряму (не звідси) — нічого не перезаписуємо, а повідомляємо.
on:
  push:
    branches: [main]
    paths: ['map/**', '.github/workflows/map.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: map, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Перевірка мапи в браузері
        run: |
          cd map/test
          npm i --no-save --no-audit --no-fund playwright@1.63.0 leaflet@1.9.4 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node maptest.mjs | tee results.txt
          ! grep -q '^❌' results.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: map-test, path: map/test/out/ }
      - name: Викласти на мапу
        id: pub
        env:
          T: ${{ secrets.MAP_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::notice::Мапу перевірено, але ще не викладено: додайте секрет MAP_TOKEN (ключ GitHub з правом запису в DesperadoAV/Svitlo_in_Slavutych) і запустіть знову"; exit 0; fi
          git clone -q "https://x-access-token:${T}@github.com/DesperadoAV/Svitlo_in_Slavutych.git" site || { echo "::error::Ключ MAP_TOKEN не дає доступу до репозиторію мапи"; exit 1; }
          cur=$(git hash-object site/index.html); new=$(git hash-object map/index.html)
          if [ "$cur" = "$new" ]; then echo "✅ На мапі вже ця версія" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          known=0; for c in $(git log --format=%H -- map/index.html); do [ "$(git rev-parse "$c:map/index.html" 2>/dev/null)" = "$cur" ] && { known=1; break; }; done
          if [ $known = 0 ]; then echo "::error::index.html на мапі змінено не звідси (напряму в DesperadoAV/Svitlo_in_Slavutych). Щоб не загубити ті зміни, спершу перенесіть їх у map/index.html"; exit 1; fi
          cp map/index.html site/index.html
          cd site
          git add index.html
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "$(git -C .. log -1 --format=%s -- map/index.html)"
          git push -q origin HEAD
          echo "📤 Викладено: $(git log -1 --format='%h %s')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "done=1" >> "$GITHUB_OUTPUT"
      - name: Перевірка наживо (лише читання)
        if: steps.pub.outputs.done == '1'
        run: |
          for i in $(seq 1 30); do
            curl -sS --max-time 20 -o live.html "https://desperadoav.github.io/Svitlo_in_Slavutych/?t=$(date +%s)" || true
            cmp -s live.html map/index.html && { echo "✅ Мапа наживо — нова версія" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 20
          done
          echo "::warning::GitHub Pages ще не показує нову версію (буває до 10 хв) — перевірте пізніше"
