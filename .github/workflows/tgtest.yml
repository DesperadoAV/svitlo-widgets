name: Тимчасово — чи дозволяє Telegram картки

# Разова перевірка: пробна картка у чат власника з ботом; якщо Telegram прийняв — одразу видаляємо її.
on:
  workflow_dispatch:
    inputs:
      chat: { description: 'ID чату', default: '242115653' }

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Пробні картки
        env:
          BT: ${{ secrets.BOT_TOKEN }}
          CHAT: ${{ inputs.chat }}
        run: |
          cat > t.mjs <<'JS'
          const T = process.env.BT, chat = +process.env.CHAT;
          const call = async (m, b) => { const r = await fetch(`https://api.telegram.org/bot${T}/${m}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b) }); return r.json(); };
          const html = "<b>Пробна картка</b><p>Перевірка — зараз зникне.</p>";
          for (const [name, body] of [["звичайна", { html }], ["спільна (is_shared)", { html, is_shared: true }]]) {
            const r = await call("sendWidget", { chat_id: chat, caption: "🧪", ...body });
            console.log(new Date().toISOString(), name, "→", r.ok ? "✅ ПРИЙНЯТО" : "❌ " + r.error_code + " " + r.description);
            if (r.ok) { const d = await call("deleteMessage", { chat_id: chat, message_id: r.result.message_id }); console.log("   видалено:", d.ok); }
          }
          JS
          node t.mjs
