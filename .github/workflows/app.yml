name: Застосунок-віджет (Android)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.b.outputs.ok }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Firebase (google-services.json із секрету)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then echo "::notice::Немає секрету GOOGLE_SERVICES_JSON — застосунок збереться без сповіщень"; exit 0; fi
          printf '%s' "$GS" > app/google-services.json
          jq -e '.client[]?.client_info.android_client_info.package_name | select(. == "ua.svitlo.widget")' app/google-services.json >/dev/null \
            || { echo "::error::GOOGLE_SERVICES_JSON — не той файл: у Firebase додайте Android-застосунок із назвою пакета ua.svitlo.widget і завантажте його google-services.json"; exit 1; }
      - name: Збірка APK
        id: b
        env:
          KS_B64: ${{ secrets.ANDROID_KS_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          mkdir -p dist
          if bash app/build.sh > dist/build.log 2>&1; then echo "ok=true" >> $GITHUB_OUTPUT; else echo "ok=false" >> $GITHUB_OUTPUT; cat dist/build.log; exit 0; fi
          cat dist/build.log
          cp app/out/svitlo-widget.apk dist/
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: dist/ }

  test:
    needs: build
    if: needs.build.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 24, target: default, arch: x86 }          # Android 7
          - { api: 28, target: google_apis, arch: x86_64 }   # Android 9
          - { api: 30, target: google_apis, arch: x86_64 }   # Android 11 (як Redmi Note 10 Pro з коробки)
          - { api: 33, target: google_apis, arch: x86_64 }   # Android 13 (Redmi Note 10 Pro після оновлень)
          - { api: 35, target: google_apis, arch: x86_64 }   # Android 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: Попередня випущена версія (щоб перевірити оновлення поверх неї)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo $(( ${{ github.run_number }} + 100 )) > apk/code.txt
          gh release download -R "${{ github.repository }}" --pattern svitlo-widget.apk -D prev 2>/dev/null && ls -la prev || echo "попередньої версії немає"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Тест на емуляторі Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash app/test/emu-test.sh ${{ matrix.api }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'test-api${{ matrix.api }}', path: app/test/out/ }

  publish:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: APK і результати → гілка app-build
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p pub/tests
          cp art/apk/* pub/ 2>/dev/null || true
          for d in art/test-api*; do [ -d "$d" ] || continue; n=$(basename $d); mkdir -p pub/tests/$n; cp $d/*.png $d/results.txt $d/crash.txt $d/logcat-app.txt pub/tests/$n/ 2>/dev/null || true; done
          { echo "Збірка: ${{ github.sha }} · run ${{ github.run_number }}"; echo "Тести: ${{ needs.test.result }}"; for f in pub/tests/*/results.txt; do [ -f "$f" ] || continue; echo; echo "== $(basename $(dirname $f))"; cat "$f"; done; [ -f art/apk/build.log ] && { echo; echo "== збірка"; tail -30 art/apk/build.log; }; true; } > pub/SUMMARY.txt
          # 📲 нова версія для людей — лише коли збірка вдалась і всі тести на емуляторах пройшли:
          # GitHub Release (звідти завантажують APK) і latest.json (його перевіряє застосунок і бот для мешканців)
          if [ "${{ needs.build.outputs.ok }}" = "true" ] && [ "${{ needs.test.result }}" = "success" ] && [ -f pub/svitlo-widget.apk ]; then
            V="1.1.${{ github.run_number }}"; C=$(( ${{ github.run_number }} + 100 ))
            NOTES=$(printf '%s' "$HEAD_MSG" | head -1 | cut -c1-200)
            gh release create "v$V" pub/svitlo-widget.apk -R "${{ github.repository }}" --title "💡 Світло В Славутичі $V" --notes "$NOTES" --latest \
              && jq -n --argjson c "$C" --arg n "$V" --arg u "https://github.com/${{ github.repository }}/releases/download/v$V/svitlo-widget.apk" --arg t "$NOTES" \
                   '{code:$c, name:$n, url:$u, notes:$t}' > pub/latest.json \
              && echo "📲 Випущено версію $V для оновлення" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # останній опис версії не губимо, навіть якщо ця збірка не пройшла тести
          [ -f pub/latest.json ] || curl -sSf "https://raw.githubusercontent.com/${{ github.repository }}/app-build/latest.json" -o pub/latest.json || true
          cd pub && git init -q && git checkout -q -b app-build && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Застосунок-віджет: збірка ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" app-build
