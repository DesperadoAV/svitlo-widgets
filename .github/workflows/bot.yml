name: Бот для мешканців → Cloudflare

# Викладає бота (папка bot/) у Cloudflare як воркер svitlo-public, кладе туди токен бота і налаштовує вебхук.
# Потрібні секрети репозиторію (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — токен Cloudflare з правами «Edit Cloudflare Workers» + D1 Edit
#   BOT_TOKEN            — токен бота від @BotFather
on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Перевірка секретів
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BT: ${{ secrets.BOT_TOKEN }}
        run: |
          [ -n "$CF" ] || { echo "::error::Немає секрету CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)"; exit 1; }
          [ -n "$BT" ] || echo "::warning::Немає секрету BOT_TOKEN — бот викладеться, але не працюватиме, доки токен не додано"
      - name: Перевірка коду бота
        run: node --check bot/worker.js && node -e "import(require('path').resolve('bot/widget.js')).then(m=>{const n=require('zlib').deflateSync(Buffer.from(m.WIDGET_HTML),{level:9}).length;console.log('віджет стиснутий:',n,'байт (межа 4096)');if(n>4096)process.exit(1)})"
      - name: Викласти в Cloudflare
        id: d
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://svitlo-public\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Адреса бота: $url"
      - name: Токен бота → Cloudflare
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BT: ${{ secrets.BOT_TOKEN }}
        run: |
          [ -n "$BT" ] || exit 0
          printf '%s' "$BT" | npx --yes wrangler@4 secret put BOT_TOKEN
      - name: Налаштувати бота (вебхук, команди)
        if: steps.d.outputs.url != ''
        run: |
          sleep 10
          curl -sS --max-time 60 "${{ steps.d.outputs.url }}/setup" | tee setup.txt
          grep -q "✅ Вебхук" setup.txt || { echo "::warning::Налаштування бота не підтвердилось — див. текст вище"; }
