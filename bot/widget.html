<style>
*{box-sizing:border-box;margin:0}
body{font:14px/1.35 -apple-system,Roboto,sans-serif;color:var(--tg-theme-text-color,#000);padding:6px 6px 4px}
.h{display:flex;align-items:baseline;gap:6px;margin:0 2px 5px}
.h b{font-size:15px}.h i,.s,.ax{font-style:normal;color:var(--tg-theme-hint-color,#888)}
.h i{margin-left:auto;font-size:11px}
.c{border-radius:10px;margin-top:5px;background:rgba(127,127,127,.12);border-left:5px solid #8a94a0}
.on{border-left-color:#1f9d55}.off{border-left-color:#d64545}
.r{display:flex;align-items:center;padding:6px 8px 2px}
.r b{font-size:15px}.r em{margin-left:auto;font-style:normal;font-weight:600}
.on em{color:#1f9d55}.off em{color:#d64545}
.s{font-size:12px;padding:0 8px 6px}
.d{padding:0 8px 7px;font-size:12px}.d p{margin-top:3px}
.bar{position:relative;height:9px;border-radius:5px;background:rgba(127,127,127,.25);margin-top:2px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:#e8a33d}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--tg-theme-text-color,#000)}
.ax{display:flex;justify-content:space-between;font-size:9px}
.k{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
button{border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;background:rgba(127,127,127,.18);color:inherit}
.y{background:var(--tg-theme-button-color,#2f80ed);color:var(--tg-theme-button-text-color,#fff)}
</style>
<div id=a></div>
<script>
var W=window.TelegramWidget||{publicData:null,onEvent:function(){}},A=document.getElementById('a'),cfg=0;
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function P(){var d=W.publicData;try{return typeof d=='string'?JSON.parse(d):d}catch(e){return null}}
function e(s){return String(s).replace(/[&<>"]/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function hm(m){m=((m%1440)+1440)%1440;return('0'+(m/60|0)).slice(-2)+':'+('0'+m%60).slice(-2)}
function iv(s){return s?s.split(',').map(function(x){x=x.split('-');return[+x[0],+x[1]]}):[]}
function day(t,o){var m=t+o,d=new Date(m*6e4);return('0'+d.getUTCDate()).slice(-2)+'.'+('0'+(d.getUTCMonth()+1)).slice(-2)}
function dur(m){return m<60?m+' хв':m<1440?(m/60|0)+' год '+m%60+' хв':(m/1440|0)+' дн '+(m%1440/60|0)+' год'}
function bar(L,n){var h=L.map(function(x){return'<i style="left:'+x[0]/14.4+'%;width:'+(x[1]-x[0])/14.4+'%"></i>'}).join('');
 return'<div class=bar>'+h+(n>=0?'<u style="left:'+n/14.4+'%"></u>':'')+'</div><div class=ax><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>'}
function txt(L){return L.length?L.map(function(x){return hm(x[0])+'–'+(x[1]>=1440?'24:00':hm(x[1]))}).join(', '):'відключень немає'}
function R(){var D=P(),h='';if(!D||!D.q){A.innerHTML='<div class=h><b>💡 Світло В Славутичі</b></div><p class=s>Дані з\'являться за хвилину</p>';return}
 var o=D.o,nm=Date.now()/6e4|0,sh=Math.floor((nm+o)/1440)-Math.floor((D.t+o)/1440),now=(nm+o)%1440,sel=ls('q'),x=ls('x');
 h='<div class=h><b>💡 Світло В Славутичі</b><i>оновлено '+hm(D.t+o)+'</i></div>';
 if(cfg){h+='<p class=s>Які черги показувати:</p><div class=k>'+D.q.map(function(q,i){return'<button data-t='+i+(!sel||sel.indexOf(q[0])>=0?' class=y':'')+'>'+e(q[0])+'</button>'}).join('')+'</div>'}
 D.q.forEach(function(q){if(sel&&sel.indexOf(q[0])<0)return;var c=q[1]>0?'on':q[1]<0?'na':'off',st=q[1]>0?'Світло є':q[1]<0?'Немає даних':'Світла немає';
  var a=sh>0?q[4]:q[3],b=sh>0?null:q[4],s='';if(q[1]>=0&&q[2]){s='з '+hm(q[2]+o)+(day(q[2],o)!=day(nm,o)?' '+day(q[2],o):'')+' · '+dur(nm-q[2])}
  h+='<div class="c '+c+'" data-x="'+e(q[0])+'"><div class=r><b>Черга '+e(q[0])+'</b><em>'+st+'</em></div>'+(s?'<p class=s>'+s+'</p>':'');
  if(x==q[0]){h+='<div class=d>';if(a!=null)h+='<p>Сьогодні: '+txt(iv(a))+'</p>'+bar(iv(a),now);else h+='<p>Графіка на сьогодні немає</p>';
   if(b!=null)h+='<p>Завтра: '+txt(iv(b))+'</p>'+bar(iv(b),-1);h+='</div>'}
  h+='</div>'});
 h+='<div class=k><button data-c=1'+(cfg?' class=y':'')+'>'+(cfg?'✓ Готово':'⚙️ Вибрати черги')+'</button></div>';A.innerHTML=h}
function g(t,k){return t.getAttribute&&t.getAttribute('data-'+k)}
A.addEventListener('click',function(v){var t=v.target;while(t&&t!=A&&!g(t,'x')&&!g(t,'t')&&!g(t,'c'))t=t.parentNode;if(!t||t==A)return;
 var D=P(),X=g(t,'x'),T=g(t,'t');if(g(t,'c'))cfg=!cfg;else if(T){var n=D.q[+T][0],s=ls('q')||D.q.map(function(q){return q[0]}),i=s.indexOf(n);if(i<0)s.push(n);else if(s.length>1)s.splice(i,1);ls('q',s)}
 else ls('x',ls('x')==X?'':X);R()});
W.onEvent('publicDataChanged',R);W.onEvent('activated',function(){W.watchPublicData&&W.watchPublicData();R()});
R();setInterval(R,3e4);W.ready&&W.ready();
</script>
